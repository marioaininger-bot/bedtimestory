name = "bedtimestory-api"
main = "generate-story.js"
compatibility_date = "2026-09-24"
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

# Nach dem Deploy erreichbar unter:
#   https://bedtimestory-api.<dein-cloudflare-subdomain>.workers.dev
#
# API-Key als Secret setzen (wird nie im Code oder im Browser sichtbar):
#   wrangler secret put ANTHROPIC_API_KEY
#
# Deploy:
#   wrangler deploy

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Gute Nacht Geschichte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#0b1026;
    --night-2:#161c3d;
    --night-3:#232a52;
    --gold:#f4c978;
    --gold-soft:#f4c97833;
    --lavender:#c9b6e4;
    --mint:#8fd6c4;
    --text:#f2eee6;
    --text-dim:#b9b6cf;
    --card:#1c2347;
    --card-border:#33396a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse at 20% 0%, #2a2f66 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, #3a2d5c 0%, transparent 50%),
      linear-gradient(180deg,var(--night-1),var(--night-2) 60%,var(--night-3));
    min-height:100%;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff8 50%, transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, #fff6 50%, transparent),
      radial-gradient(2px 2px at 60% 30%, #fff9 50%, transparent),
      radial-gradient(1px 1px at 30% 60%, #fff5 50%, transparent),
      radial-gradient(1.5px 1.5px at 90% 70%, #fff7 50%, transparent),
      radial-gradient(1px 1px at 45% 85%, #fff5 50%, transparent),
      radial-gradient(2px 2px at 15% 90%, #fff8 50%, transparent);
    pointer-events:none;
    z-index:0;
  }
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px 64px;position:relative;z-index:1;}

  .hero{text-align:center;margin-bottom:36px;}
  .hero .glyphs{font-size:28px;letter-spacing:14px;margin-bottom:6px;opacity:.9;}
  .hero h1{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(32px,6vw,44px);
    margin:0 0 8px;
    background:linear-gradient(90deg,var(--gold),var(--lavender));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p{color:var(--text-dim);margin:0;font-size:16px;}

  section.panel{
    background:linear-gradient(180deg,var(--card),#181e3d);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:24px;
    margin-bottom:22px;
    box-shadow:0 10px 30px -12px #00000066;
  }
  .panel h2{
    font-family:'Baloo 2',cursive;
    font-size:20px;
    margin:0 0 4px;
    display:flex;align-items:center;gap:10px;
  }
  .panel .sub{color:var(--text-dim);font-size:13.5px;margin:0 0 18px;}

  /* Profil */
  .profile-toggle{
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;user-select:none;
  }
  .profile-toggle .icon{transition:transform .25s ease;}
  .profile-toggle.open .icon{transform:rotate(45deg);}
  .profile-body{
    max-height:0;overflow:hidden;transition:max-height .3s ease;
  }
  .profile-body.open{max-height:400px;margin-top:16px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .field{flex:1;min-width:140px;}
  .field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .field select,.field input{
    width:100%;padding:11px 12px;border-radius:12px;
    background:#10142c;border:1px solid var(--card-border);
    color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;
  }
  .field select:focus,.field input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .save-btn{
    margin-top:4px;
    background:var(--mint);color:#0b1026;border:none;
    padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer;
    font-family:'Nunito',sans-serif;font-size:14.5px;
  }
  .save-btn:hover{filter:brightness(1.08);}
  .saved-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--gold-soft);border:1px solid var(--gold);
    color:var(--gold);padding:5px 12px;border-radius:999px;font-size:13px;margin-left:10px;
  }

  /* Genres */
  .genre-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:10px;
  }
  .genre-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:14px 8px;border-radius:16px;
    background:#10142c;border:1px solid var(--card-border);
    color:var(--text);cursor:pointer;font-family:'Nunito',sans-serif;
    font-size:13.5px;font-weight:600;text-align:center;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .genre-btn .emoji{font-size:26px;}
  .genre-btn:hover{transform:translateY(-2px);border-color:var(--lavender);}
  .genre-btn.active{
    background:linear-gradient(160deg,#3a3170,#2a2456);
    border-color:var(--gold);
    box-shadow:0 0 0 2px var(--gold-soft) inset;
  }
  .genre-btn:disabled:not(.active){opacity:.35;cursor:not-allowed;transform:none;}
  .genre-counter{margin-top:14px;color:var(--text-dim);font-size:13.5px;text-align:center;}
  .genre-counter b{color:var(--gold);}

  /* Lesedauer */
  .duration-row{display:flex;gap:10px;flex-wrap:wrap;}
  .duration-btn{
    flex:1;min-width:140px;
    padding:16px 10px;border-radius:16px;
    background:#10142c;border:1px solid var(--card-border);
    color:var(--text);cursor:pointer;text-align:center;
    font-family:'Nunito',sans-serif;
  }
  .duration-btn .emoji{font-size:22px;display:block;margin-bottom:4px;}
  .duration-btn .label{font-weight:700;font-size:14.5px;}
  .duration-btn .meta{color:var(--text-dim);font-size:12.5px;}
  .duration-btn.active{
    background:linear-gradient(160deg,#3a3170,#2a2456);
    border-color:var(--gold);
    box-shadow:0 0 0 2px var(--gold-soft) inset;
  }

  /* CTA */
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:28px 0 8px;}
  .btn-primary,.btn-secondary{
    font-family:'Baloo 2',cursive;font-weight:700;font-size:17px;
    padding:15px 26px;border-radius:16px;cursor:pointer;border:none;
  }
  .btn-primary{
    background:linear-gradient(90deg,var(--gold),#ffe1a8);
    color:#241a03;
    box-shadow:0 8px 22px -8px #f4c97888;
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none;}
  .btn-secondary{
    background:transparent;border:1px solid var(--card-border);color:var(--text);
  }

  .hint{text-align:center;color:var(--text-dim);font-size:13px;margin-top:4px;}

  /* Story */
  #storyPanel{display:none;}
  #storyPanel h2{font-size:24px;}
  #storyText{
    font-size:16.5px;line-height:1.75;white-space:pre-wrap;
    font-family:'Nunito',sans-serif;
  }
  #storyText p{margin:0 0 14px;}
  .story-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;}

  @media print{
    body::before{display:none;}
    .hero,.panel:not(#storyPanel),.cta-row,.story-actions,.hint{display:none !important;}
    body{background:#fff;color:#111;}
    #storyPanel{display:block !important;border:none;box-shadow:none;background:none;}
    #storyText{color:#111;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="glyphs">🌙 ⭐ 🌙</div>
    <h1>Gute Nacht Geschichte</h1>
    <p>Träum dich in eine neue Welt ✨</p>
  </div>

  <section class="panel">
    <div class="profile-toggle" id="profileToggle">
      <h2>👧 Kinderprofil</h2>
      <span class="icon">➕</span>
    </div>
    <p class="sub">Profil erstellen (optional) — für eine personalisierte Geschichte</p>
    <div class="profile-body" id="profileBody">
      <div class="field-row">
        <div class="field">
          <label for="childName">Name</label>
          <input type="text" id="childName" placeholder="z.B. Sophia">
        </div>
        <div class="field">
          <label for="childAge">Alter</label>
          <select id="childAge">
            <option value="">Wählen…</option>
            <option>3</option><option>4</option><option>5</option><option>6</option>
            <option>7</option><option>8</option><option>9</option><option>10</option>
            <option>11</option><option>12</option>
          </select>
        </div>
        <div class="field">
          <label for="childGender">Geschlecht</label>
          <select id="childGender">
            <option value="">Wählen…</option>
            <option value="Mädchen">Mädchen 👧</option>
            <option value="Junge">Junge 👦</option>
            <option value="Divers">Divers 🧒</option>
          </select>
        </div>
      </div>
      <button class="save-btn" id="saveProfile">✅ Profil speichern</button>
      <span class="saved-chip" id="savedChip" style="display:none;">✅ Gespeichert</span>
    </div>
  </section>

  <section class="panel">
    <h2>🎭 Genre wählen</h2>
    <p class="sub">Wähle bis zu 5 Genres</p>
    <div class="genre-grid" id="genreGrid"></div>
    <div class="genre-counter"><b id="genreCount">0</b>/5 ausgewählt</div>
  </section>

  <section class="panel">
    <h2>⏱️ Lesedauer</h2>
    <div class="duration-row" id="durationRow">
      <button class="duration-btn" data-value="kurz" data-min="5">
        <span class="emoji">⚡</span><span class="label">Kurz</span><span class="meta">~5 Min.</span>
      </button>
      <button class="duration-btn active" data-value="mittel" data-min="10">
        <span class="emoji">📖</span><span class="label">Mittel</span><span class="meta">~10 Min.</span>
      </button>
      <button class="duration-btn" data-value="lang" data-min="15">
        <span class="emoji">🌙</span><span class="label">Lang</span><span class="meta">~15 Min.</span>
      </button>
    </div>
  </section>

  <div class="cta-row">
    <button class="btn-primary" id="tellBtn">🌙 Geschichte erzählen!</button>
  </div>
  <p class="hint" id="genreHint">Bitte mindestens 1 Genre auswählen</p>

  <section class="panel" id="storyPanel">
    <h2 id="storyTitle">📖 Titel</h2>
    <div id="storyText"></div>
    <div class="story-actions">
      <button class="btn-secondary" id="newStoryBtn">🔄 Neue Geschichte</button>
      <button class="btn-secondary" id="printBtn">🖨️ Drucken</button>
    </div>
  </section>

</div>

<script>
/* ---------- Genres (20 total, bis zu 5 wählbar) ---------- */
const GENRES = [
  {id:'abenteuer', emoji:'⚔️', label:'Abenteuer'},
  {id:'fantasie', emoji:'🦄', label:'Fantasie'},
  {id:'natur', emoji:'🦊', label:'Natur & Tiere'},
  {id:'magie', emoji:'🪄', label:'Magie'},
  {id:'weltraum', emoji:'🚀', label:'Weltraum'},
  {id:'piraten', emoji:'🏴‍☠️', label:'Piraten'},
  {id:'detektiv', emoji:'🔍', label:'Detektiv'},
  {id:'maerchen', emoji:'🏰', label:'Märchen'},
  {id:'prinzessin', emoji:'👸', label:'Prinzessin'},
  {id:'hexen', emoji:'🧙', label:'Hexen'},
  {id:'drachen', emoji:'🐉', label:'Drachen'},
  {id:'meerjungfrau', emoji:'🧜', label:'Meerjungfrau'},
  {id:'dinosaurier', emoji:'🦕', label:'Dinosaurier'},
  {id:'superhelden', emoji:'🦸', label:'Superhelden'},
  {id:'elfen', emoji:'🧚', label:'Elfen & Feen'},
  {id:'roboter', emoji:'🤖', label:'Roboter'},
  // 4 neue Genres
  {id:'zirkus', emoji:'🎪', label:'Zirkus'},
  {id:'eisenbahn', emoji:'🚂', label:'Eisenbahn'},
  {id:'kuscheltiere', emoji:'🧸', label:'Kuscheltiere'},
  {id:'regenbogen', emoji:'🌈', label:'Regenbogenland'},
];
const MAX_GENRES = 5;
let selectedGenres = [];
let selectedDuration = 'mittel';

/* ---------- Profil ---------- */
const profileToggle = document.getElementById('profileToggle');
const profileBody = document.getElementById('profileBody');
profileToggle.addEventListener('click', () => {
  profileToggle.classList.toggle('open');
  profileBody.classList.toggle('open');
});

function loadProfile(){
  try{
    const raw = localStorage.getItem('gnc_profile');
    if(!raw) return;
    const p = JSON.parse(raw);
    document.getElementById('childName').value = p.name || '';
    document.getElementById('childAge').value = p.age || '';
    document.getElementById('childGender').value = p.gender || '';
  }catch(e){}
}
document.getElementById('saveProfile').addEventListener('click', () => {
  const profile = {
    name: document.getElementById('childName').value.trim(),
    age: document.getElementById('childAge').value,
    gender: document.getElementById('childGender').value,
  };
  try{ localStorage.setItem('gnc_profile', JSON.stringify(profile)); }catch(e){}
  const chip = document.getElementById('savedChip');
  chip.style.display = 'inline-flex';
  setTimeout(()=>chip.style.display='none', 2200);
});
loadProfile();

/* ---------- Genre-Grid rendern ---------- */
const genreGrid = document.getElementById('genreGrid');
GENRES.forEach(g => {
  const btn = document.createElement('button');
  btn.className = 'genre-btn';
  btn.dataset.id = g.id;
  btn.innerHTML = `<span class="emoji">${g.emoji}</span><span>${g.label}</span>`;
  btn.addEventListener('click', () => toggleGenre(g.id, btn));
  genreGrid.appendChild(btn);
});

function toggleGenre(id, btn){
  const idx = selectedGenres.indexOf(id);
  if(idx >= 0){
    selectedGenres.splice(idx,1);
    btn.classList.remove('active');
  } else {
    if(selectedGenres.length >= MAX_GENRES) return;
    selectedGenres.push(id);
    btn.classList.add('active');
  }
  document.getElementById('genreCount').textContent = selectedGenres.length;
  document.querySelectorAll('.genre-btn').forEach(b=>{
    if(!b.classList.contains('active')){
      b.disabled = selectedGenres.length >= MAX_GENRES;
    }
  });
  updateTellButton();
}

/* ---------- Lesedauer ---------- */
document.querySelectorAll('.duration-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.duration-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedDuration = btn.dataset.value;
  });
});

/* ---------- CTA-Status ---------- */
const tellBtn = document.getElementById('tellBtn');
const genreHint = document.getElementById('genreHint');
function updateTellButton(){
  const ok = selectedGenres.length > 0;
  tellBtn.disabled = !ok;
  genreHint.style.display = ok ? 'none' : 'block';
}
updateTellButton();

/* ---------- Story-Generator (lokal, offline-fähig) ---------- */
const NAMES_FALLBACK = ['Mia','Ben','Luca','Emma','Leo','Nora'];

const OPENERS = [
  "Es war schon spät am Abend, als {name} noch einen letzten Blick aus dem Fenster warf.",
  "Kaum hatte {name} die Augen geschlossen, begann das Kopfkissen ganz leise zu summen.",
  "In der Nacht, in der die Sterne besonders hell leuchteten, passierte etwas Besonderes.",
  "{name} kuschelte sich tief in die Decke, als draußen ein sanftes Leuchten den Himmel füllte."
];

const GENRE_SCENES = {
  abenteuer: ["ein verborgener Pfad tauchte zwischen den Bäumen auf", "eine alte Schatzkarte flatterte plötzlich vom Regal"],
  fantasie: ["ein Tor aus schimmerndem Nebel öffnete sich mitten im Zimmer", "kleine Lichtkugeln tanzten durch die Luft und formten eine Tür"],
  natur: ["ein Fuchs mit goldenem Fell schaute neugierig durchs Fenster", "der Wald hinterm Haus begann leise zu flüstern"],
  magie: ["der Zauberstab auf dem Nachttisch begann zu funkeln", "eine Prise Sternenstaub rieselte vom Himmel herab"],
  weltraum: ["ein kleines Raumschiff landete sanft auf der Fensterbank", "die Sterne draußen begannen, im Takt zu blinken"],
  piraten: ["ein Papagei mit Augenklappe landete auf dem Bettpfosten", "am Horizont tauchte ein Segelschiff aus goldenem Licht auf"],
  detektiv: ["auf dem Boden lag eine geheimnisvolle Spur aus Fußabdrücken", "eine verschlüsselte Nachricht steckte unter dem Kopfkissen"],
  maerchen: ["ein altes Buch auf dem Regal schlug von selbst auf", "eine Fee in einem Blütenkleid saß plötzlich auf der Bettkante"],
  prinzessin: ["eine Kutsche aus Mondlicht hielt vor dem Fenster", "eine Krone aus Sternenstaub schwebte leise heran"],
  hexen: ["ein Kessel begann sanft vor sich hin zu blubbern", "eine freundliche Hexe rührte in einer Wolke aus Glitzerrauch"],
  drachen: ["ein kleiner Drache mit schimmernden Schuppen klopfte ans Fenster", "warmer, glitzernder Rauch kräuselte sich unter der Tür hindurch"],
  meerjungfrau: ["das Zimmer roch plötzlich nach Salzwasser und Muscheln", "eine Perlenspur führte bis zum Bett"],
  dinosaurier: ["ein leises Brummen ließ die Vorhänge zittern", "ein winziger Dino-Fußabdruck leuchtete auf dem Boden"],
  superhelden: ["ein Umhang lag plötzlich über der Bettdecke", "draußen blitzte kurz ein bunter Lichtstrahl auf"],
  elfen: ["kleine geflügelte Wesen huschten durchs Zimmer", "Blütenblätter schwebten scheinbar aus dem Nichts herab"],
  roboter: ["ein freundliches Piepen kam aus der Spielzeugkiste", "kleine bunte Lichter blinkten im Takt eines sanften Countdowns"],
  zirkus: ["bunte Wimpel spannten sich plötzlich quer durchs Zimmer", "irgendwo klang leise Zirkusmusik, ganz von selbst"],
  eisenbahn: ["ein kleiner Zug tutete leise vom Fußende des Bettes", "Schienen aus Mondlicht zogen sich über den Boden"],
  kuscheltiere: ["die Kuscheltiere auf dem Regal begannen zu blinzeln", "ein weiches Rascheln kam aus der Kuscheltier-Kiste"],
  regenbogen: ["ein Regenbogen spannte sich mitten durchs Zimmer", "bunte Lichtstreifen tanzten über die Wände"]
};

const GENRE_COMPANIONS = {
  abenteuer: "der mutige Kobold Fips", fantasie: "das Lichtwesen Lumi", natur: "der Fuchs Pinselohr",
  magie: "die Zauberin Elara", weltraum: "der Roboter Astro", piraten: "der Papagei Käpt'n Grün",
  detektiv: "die kluge Eule Sherlocke", maerchen: "die Fee Rosalind", prinzessin: "die Hofdame Lili",
  hexen: "die Hexe Mira", drachen: "der kleine Drache Funkel", meerjungfrau: "die Meerjungfrau Perla",
  dinosaurier: "der Dino Rexi", superhelden: "die Heldin Blitz", elfen: "die Elfe Federleicht",
  roboter: "der Roboter Blip", zirkus: "der Clown Pipapo", eisenbahn: "der Lokführer-Bär Dampf",
  kuscheltiere: "der Teddy Knopf", regenbogen: "das Regenbogenwesen Iris"
};

const MIDDLE_BEATS = [
  "Gemeinsam machten sie sich auf den Weg, vorbei an Orten, die {name} noch nie zuvor gesehen hatte.",
  "Es gab kleine Rätsel zu lösen, und {name} half mit Mut und einer guten Portion Neugier.",
  "Unterwegs trafen sie auf eine Herausforderung, die nur mit Zusammenhalt zu meistern war.",
  "Zwischendurch gab es ein herzliches Lachen, als etwas Unerwartetes, aber Schönes passierte.",
  "Sie kamen an einen ruhigen Ort, an dem sie kurz verschnauften und die Stille genossen."
];

const CLOSERS = [
  "Langsam wurde {name} müde, und alles um sie herum begann sanft zu leuchten und zu verblassen.",
  "Zufrieden und ein kleines bisschen stolz kuschelte sich {name} wieder tief in die Decke.",
  "Mit einem letzten warmen Gefühl im Bauch schloss {name} die Augen.",
];

const GOODNIGHT = [
  "Gute Nacht, {name}. Schlaf schön. 🌙✨",
  "Und so schlief {name} friedlich ein, während die Sterne weiter über dem Haus wachten. Gute Nacht, {name}. 🌙",
  "Draußen leuchtete der Mond noch eine ganze Weile sanft ins Zimmer. Gute Nacht, {name}. ⭐"
];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr, n){
  const copy = [...arr];
  const out = [];
  while(copy.length && out.length < n){
    out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  }
  return out;
}

function buildStory(){
  const profile = (()=>{ try{return JSON.parse(localStorage.getItem('gnc_profile')||'{}');}catch(e){return {};} })();
  const name = profile.name && profile.name.trim() ? profile.name.trim() : pick(NAMES_FALLBACK);
  const genres = selectedGenres.length ? selectedGenres : ['maerchen'];

  const beatsCount = selectedDuration === 'kurz' ? 2 : selectedDuration === 'lang' ? 5 : 3;

  const paragraphs = [];
  paragraphs.push(pick(OPENERS).replaceAll('{name}', name) + " " + pick(GENRE_SCENES[genres[0]]) + ".");

  const companions = genres.map(g => GENRE_COMPANIONS[g]).filter((v,i,a)=>a.indexOf(v)===i);
  const mainCompanion = companions[0];
  paragraphs.push(`Vor {name} stand ${mainCompanion}, mit einem freundlichen Lächeln. „Komm mit", flüsterte ${mainCompanion.split(' ').slice(-1)[0] === mainCompanion ? mainCompanion : mainCompanion}, „ich zeig dir etwas ganz Besonderes."`.replaceAll('{name}', name));

  const beats = pickN(MIDDLE_BEATS, beatsCount);
  beats.forEach((b,i) => {
    let extra = "";
    if(genres[i+1] && GENRE_SCENES[genres[i+1]]){
      extra = " " + pick(GENRE_SCENES[genres[i+1]]).charAt(0).toUpperCase() + pick(GENRE_SCENES[genres[i+1]]).slice(1) + ".";
    }
    paragraphs.push(b.replaceAll('{name}', name) + extra);
  });

  paragraphs.push(pick(CLOSERS).replaceAll('{name}', name));
  paragraphs.push(pick(GOODNIGHT).replaceAll(/\{name\}/g, name));

  const genreLabels = genres.map(id => GENRES.find(g=>g.id===id)?.label).filter(Boolean);
  const title = `${name} und ${genreLabels[0] === 'Fantasie' ? 'die Welt der Fantasie' : 'das Geheimnis von ' + genreLabels[0]}`;

  return {title, paragraphs};
}

/* ---------- Buttons: erzählen / neu / drucken ---------- */
const storyPanel = document.getElementById('storyPanel');
const storyTitle = document.getElementById('storyTitle');
const storyText = document.getElementById('storyText');

function currentPayload(){
  const profile = (()=>{ try{return JSON.parse(localStorage.getItem('gnc_profile')||'{}');}catch(e){return {};} })();
  const genres = selectedGenres.length ? selectedGenres : ['maerchen'];
  const genreLabels = genres.map(id => GENRES.find(g=>g.id===id)?.label).filter(Boolean);
  return {
    name: profile.name && profile.name.trim() ? profile.name.trim() : null,
    age: profile.age || null,
    gender: profile.gender || null,
    genres: genreLabels,
    duration: selectedDuration
  };
}

async function renderStory(){
  tellBtn.disabled = true;
  const newBtn = document.getElementById('newStoryBtn');
  newBtn.disabled = true;
  storyPanel.style.display = 'block';
  storyTitle.textContent = "📖 …";
  storyText.innerHTML = '<p>✨ Die Geschichte wird gerade erdacht … einen Moment noch.</p>';
  storyPanel.scrollIntoView({behavior:'smooth', block:'start'});

  try{
    const res = await fetch('/.netlify/functions/generate-story', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(currentPayload())
    });
    if(!res.ok) throw new Error('Server-Fehler: ' + res.status);
    const data = await res.json();
    storyTitle.textContent = "📖 " + (data.title || 'Gute Nacht Geschichte');
    const paras = (data.story || '').split(/\n{2,}/).filter(Boolean);
    storyText.innerHTML = paras.map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  }catch(err){
    storyTitle.textContent = "📖 Hoppla";
    storyText.innerHTML = `<p>Die Geschichte konnte gerade nicht erzählt werden (${err.message}). Bitte versuch es nochmal.</p>`;
  }finally{
    tellBtn.disabled = false;
    newBtn.disabled = false;
  }
}

tellBtn.addEventListener('click', renderStory);
document.getElementById('newStoryBtn').addEventListener('click', renderStory);
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
</script>
